name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Valeurs factices : la CI ne se connecte à aucune base.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  SESSION_SECRET: ci-secret-not-used-in-production

# Chaque job est un bloc sur GitHub ; « needs » trace les flèches :
#   Architecture ─┐
#                 ├─► Tests ─► Build
#   Typecheck ────┘
jobs:
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm depcruise

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run typecheck

  test:
    name: Tests
    needs: [architecture, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run test

  build:
    name: Build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm turbo run build
