name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Valeurs factices : la CI ne se connecte à aucune base.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SESSION_SECRET: ci-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Règles d'architecture
        run: pnpm depcruise
      - name: Typecheck, tests et build
        run: pnpm turbo run typecheck test build
